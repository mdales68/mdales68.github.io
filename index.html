<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio fotografico di ritratti. Visualizza una galleria di ritratti in formato verticale con un carosello interattivo.">
  <meta name="author" content="Fotografo Ritrattista">
  <title>Ritratti | Portfolio Fotografico</title>
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ritratti | Portfolio Fotografico">
  <meta property="og:description" content="Galleria di ritratti d'autore in formato verticale.">
  <meta property="og:image" content="images/IMG001.jpg">

  <!-- Link ai fogli di stile -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Intestazione -->
  <header>
    <h1>Ritratti</h1>
    <p>Portfolio Fotografico</p>
  </header>

  <!-- Area Principale con Carosello -->
  <main>
    <!-- Contenitore principale del carosello -->
    <div class="carousel-container" id="my-carousel">
      
      <!-- Indicatore di caricamento (Spinner) -->
      <div class="loader-container" id="loader-container">
        <div class="loader"></div>
      </div>

      <!-- Frecce di Navigazione -->
      <button class="carousel-arrow arrow-left" id="arrow-left" aria-label="Foto precedente">
        <svg viewBox="0 0 24 24">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <button class="carousel-arrow arrow-right" id="arrow-right" aria-label="Prossima foto">
        <svg viewBox="0 0 24 24">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <!-- Viewport in cui appaiono le foto -->
      <div class="carousel-viewport" id="carousel-viewport">
        <!-- Le slide verranno inserite dinamicamente da JavaScript -->
      </div>

    </div>

    <!-- Controlli del Carosello -->
    <div class="carousel-controls">
      <!-- Pallini di navigazione -->
      <div class="carousel-dots" id="carousel-dots"></div>

      <!-- Pulsanti e contatore aggiuntivi -->
      <div class="control-buttons-container">
        <!-- Pulsante Autoplay -->
        <button class="autoplay-btn" id="autoplay-btn" aria-label="Avvia presentazione">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Play
        </button>

        <!-- Contatore foto (es. 1 / 5) -->
        <div class="image-counter" id="image-counter"></div>
      </div>
    </div>
  </main>

  <!-- Piè di pagina -->
  <footer>
    <p>&copy; 2026. Tutti i diritti riservati. Pubblicato su <a href="https://github.com" target="_blank" rel="noopener">GitHub Pages</a>.</p>
  </footer>

  <!-- Script logic -->
  <script src="script.js"></script>
</body>
</html>
